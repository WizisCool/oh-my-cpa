services:
  cpa:
    image: ${CPA_IMAGE:-eceasy/cli-proxy-api:v8.0.2}
    pull_policy: if_not_present
    container_name: ${CPA_CONTAINER_NAME:-cli-proxy-api}
    environment:
      TZ: ${TZ:-UTC}
      DEPLOY: ${DEPLOY:-}
      MANAGEMENT_PASSWORD: ${CPA_MANAGEMENT_KEY:?set CPA_MANAGEMENT_KEY}
    expose:
      - "8317"
    volumes:
      - ${CPA_CONFIG_PATH:-../cpa/config.yaml}:/CLIProxyAPI/config.yaml
      - ${CPA_AUTH_PATH:-../cpa/auths}:/root/.cli-proxy-api
      - ${CPA_LOG_PATH:-../cpa/logs}:/CLIProxyAPI/logs
      - ${CPA_PLUGIN_PATH:-../cpa/plugins}:/CLIProxyAPI/plugins
    healthcheck:
      # The CPA image is Debian without wget or curl, so the probe speaks HTTP through
      # bash's /dev/tcp. /healthz needs no management key, unlike the management routes.
      test:
        [
          "CMD",
          "bash",
          "-c",
          "exec 3<>/dev/tcp/127.0.0.1/8317 && printf 'GET /healthz
            HTTP/1.0\\r\\n\\r\\n' >&3 && head -n 1 <&3 | grep -q ' 200 '"
        ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    restart: unless-stopped
    networks:
      - oh-my-cpa
    ports:
      - ${CPA_BIND:-127.0.0.1:8317}:8317

  oh-my-cpa:
    image: ${OMCPA_IMAGE:-wiziscool/oh-my-cpa:v0.1.0}
    container_name: ${OMCPA_CONTAINER_NAME:-oh-my-cpa}
    user: "10001:10001"
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    depends_on:
      cpa:
        condition: service_healthy
    expose:
      - "8080"
    environment:
      TZ: ${TZ:-UTC}
      OMCPA_LISTEN_ADDR: ":8080"
      OMCPA_BASE_PATH: ${OMCPA_BASE_PATH:-/omc}
      OMCPA_DATA_DIR: /data
      OMCPA_CPA_BASE_URL: http://cpa:8317
      OMCPA_CPA_USAGE_ADDR: cpa:8317
      OMCPA_CPA_MANAGEMENT_KEY: ${CPA_MANAGEMENT_KEY:?set CPA_MANAGEMENT_KEY}
      OMCPA_MASTER_KEY: ${OMCPA_MASTER_KEY:?set OMCPA_MASTER_KEY}
      OMCPA_PUBLIC_URL: ${OMCPA_PUBLIC_URL:-http://127.0.0.1:8080}
      OMCPA_TRUSTED_PROXY_CIDRS: ${OMCPA_TRUSTED_PROXY_CIDRS:-}
      OMCPA_USAGE_INGEST_MODE: ${OMCPA_USAGE_INGEST_MODE:-auto}
      OMCPA_UPDATE_CHECK_ENABLED: ${OMCPA_UPDATE_CHECK_ENABLED:-true}
      OMCPA_UPDATE_CHECK_ON_PAGE_LOAD: ${OMCPA_UPDATE_CHECK_ON_PAGE_LOAD:-true}
    volumes:
      - ${OMCPA_DATA_PATH:-../oh-my-cpa-data}:/data
    restart: unless-stopped
    networks:
      - oh-my-cpa
    ports:
      - ${OMCPA_BIND:-127.0.0.1:8080}:8080

networks:
  oh-my-cpa:
    name: ${OMCPA_NETWORK_NAME:-oh-my-cpa}
