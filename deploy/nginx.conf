server {
    listen 80;
    server_name omc.example.com;

    # OMC owns this hostname at the site root. When it shares a hostname with
    # CPA, give OMC a dedicated hostname or an explicit OMCPA_BASE_PATH instead.
    location / {
        proxy_pass http://oh-my-cpa:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Keep the app's OMCPA_TRUSTED_PROXY_CIDRS in sync with this proxy's
        # source network so per-client login throttling sees the real client.
    }
}

server {
    listen 80 default_server;
    server_name _;

    location / {
        proxy_pass http://cpa:8317;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
