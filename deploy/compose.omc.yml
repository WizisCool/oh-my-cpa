services:
  oh-my-cpa:
    image: ${OMCPA_IMAGE:-wiziscool/oh-my-cpa:latest}
    container_name: ${OMCPA_CONTAINER_NAME:-oh-my-cpa}
    user: "10001:10001"
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    ports:
      - ${OMCPA_BIND:-127.0.0.1:8080}:8080
    environment:
      TZ: ${TZ:-UTC}
      OMCPA_LISTEN_ADDR: ":8080"
      OMCPA_BASE_PATH: ${OMCPA_BASE_PATH:-/omc}
      OMCPA_DATA_DIR: /data
      OMCPA_CPA_BASE_URL: ${OMCPA_CPA_BASE_URL:?set OMCPA_CPA_BASE_URL}
      OMCPA_CPA_USAGE_ADDR: ${OMCPA_CPA_USAGE_ADDR:-}
      OMCPA_CPA_MANAGEMENT_KEY: ${OMCPA_CPA_MANAGEMENT_KEY:?set OMCPA_CPA_MANAGEMENT_KEY}
      OMCPA_MASTER_KEY: ${OMCPA_MASTER_KEY:?set OMCPA_MASTER_KEY}
      OMCPA_PUBLIC_URL: ${OMCPA_PUBLIC_URL:-http://127.0.0.1:8080}
      OMCPA_TRUSTED_PROXY_CIDRS: ${OMCPA_TRUSTED_PROXY_CIDRS:-}
      OMCPA_USAGE_INGEST_MODE: ${OMCPA_USAGE_INGEST_MODE:-auto}
      OMCPA_UPDATE_CHECK_ENABLED: ${OMCPA_UPDATE_CHECK_ENABLED:-true}
      OMCPA_UPDATE_CHECK_ON_PAGE_LOAD: ${OMCPA_UPDATE_CHECK_ON_PAGE_LOAD:-true}
    volumes:
      - ${OMCPA_DATA_PATH:-../oh-my-cpa-data}:/data
    restart: unless-stopped
    extra_hosts:
      - host.docker.internal:host-gateway
networks:
  default:
    name: ${OMCPA_NETWORK_NAME:-oh-my-cpa-standalone}
    external: ${OMCPA_NETWORK_EXTERNAL:-false}
