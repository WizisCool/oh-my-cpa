services:
  oh-my-cpa:
    build:
      context: ..
      dockerfile: Dockerfile
    image: ${OMCPA_IMAGE:-oh-my-cpa:local}
    container_name: ${OMCPA_CONTAINER_NAME:-oh-my-cpa}
    ports:
      - "${OMCPA_BIND:-127.0.0.1:8080}:8080"
    environment:
      OMCPA_LISTEN_ADDR: ":8080"
      OMCPA_BASE_PATH: ${OMCPA_BASE_PATH:-/omc}
      OMCPA_DATA_DIR: /data
      OMCPA_CPA_BASE_URL: ${OMCPA_CPA_BASE_URL:?set OMCPA_CPA_BASE_URL}
      OMCPA_CPA_USAGE_ADDR: ${OMCPA_CPA_USAGE_ADDR:-}
      OMCPA_CPA_MANAGEMENT_KEY: ${OMCPA_CPA_MANAGEMENT_KEY:?set OMCPA_CPA_MANAGEMENT_KEY}
      OMCPA_MASTER_KEY: ${OMCPA_MASTER_KEY:?set OMCPA_MASTER_KEY}
      OMCPA_SESSION_SECRET: ${OMCPA_SESSION_SECRET:?set OMCPA_SESSION_SECRET}
      OMCPA_ADMIN_PASSWORD: ${OMCPA_ADMIN_PASSWORD:?set OMCPA_ADMIN_PASSWORD}
      OMCPA_PUBLIC_URL: ${OMCPA_PUBLIC_URL:?set OMCPA_PUBLIC_URL}
    volumes:
      - ${OMCPA_DATA_PATH:-../oh-my-cpa-data}:/data
    restart: unless-stopped
