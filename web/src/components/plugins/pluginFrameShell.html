<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="frame-src 'self' blob:" />
    <style>
      html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
      iframe { display: block; border: 0; width: 100%; height: 100%; color-scheme: inherit; }
    </style>
  </head>
  <body>
    <iframe referrerpolicy="no-referrer" allow="clipboard-read; clipboard-write"></iframe>
  </body>
</html>
