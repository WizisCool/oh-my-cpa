<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <!-- The document paints the console's own ground before its stylesheet arrives. A phone that
         discarded a backgrounded tab returns to a fresh navigation, and the window between the
         HTML arriving and the bundle mounting is spent on this element alone: the default white
         canvas is a bright flash in a dark console. The two values are the shipped palettes' page
         ground (`theme/palette.ts`); `web/tests/logic/theme-boot.test.ts` holds them to it. -->
    <style>
      html { background-color: #131314; color-scheme: dark; }
      html[data-theme-mode='light'] { background-color: #f7f7f8; color-scheme: light; }
    </style>
    <!-- The mode this browser last chose, read while the document parses, so the stylesheet's light
         block applies on its first paint rather than after the bundle mounts. The stored document
         is `omc-theme`, whose shape and legacy forms `theme/themePreference.ts` owns; an unreadable
         one leaves the dark ground the console ships. -->
    <script id="omc-theme-boot">
      (function () {
        // The preset-only document `theme/themePreference.ts` still migrates: `light` and `dark` are
        // modes themselves, and a bare palette id answers with the mode it belongs to. `midnight`
        // and `porcelain` are the two withdrawn ids its reader maps to `pewter` and `fog`; a palette
        // added to that registry belongs here too, and the boot test answers the same values.
        var legacyPaletteModes = {
          'omc-dark': 'dark', pewter: 'dark', forest: 'dark', midnight: 'dark',
          'omc-light': 'light', fog: 'light', sandstone: 'light', porcelain: 'light'
        };
        try {
          var stored = window.localStorage.getItem('omc-theme');
          if (!stored) return;
          var mode;
          if (stored.charAt(0) === '{') {
            mode = JSON.parse(stored).mode;
          } else {
            mode = stored.trim().toLowerCase();
            if (legacyPaletteModes[mode]) mode = legacyPaletteModes[mode];
          }
          if (mode === 'system') {
            mode = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
          }
          if (mode === 'light' || mode === 'dark') document.documentElement.dataset.themeMode = mode;
        } catch (error) {
          // The bundle reads the same preference and paints the console once it mounts.
        }
      })();
    </script>
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <!-- Every URL in the manifest is relative, and start_url, scope and the icon sources resolve
         against the MANIFEST's URL, so one committed file is correct at the site root and under
         every configured base path. The manifest deliberately carries no id: a relative id
         resolves against start_url's ORIGIN, not the manifest URL, so "./" would collapse every
         mount point onto one installed identity. Omitted, the identity IS the resolved start_url,
         which already differs per mount. The Go service serves the manifest itself (see
         internal/api/pwa.go) because a fallback to index.html is not a manifest. -->
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <meta name="application-name" content="Oh My CPA" />
    <!-- A back office is not for search results. The server sends the same policy as an
         X-Robots-Tag header on every response and answers robots.txt (internal/api/robots.go);
         this copy survives a cache or proxy that drops response headers. -->
    <meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex" />
    <!-- Current browsers take standalone display from the manifest. These two meta tags are
         the legacy declarations: Chrome on Android read `mobile-web-app-capable` before it
         honored `display`, and iOS before 16.4 reads only the prefixed form to launch without
         Safari chrome. -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <!-- The browser UI tint follows the operating system's preference; the manifest's single
         theme_color is the console's own dark surface, which is its shipped default. -->
    <meta name="theme-color" content="#f7f7f8" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#131314" media="(prefers-color-scheme: dark)" />
    <!-- `viewport-fit=cover` is what makes `env(safe-area-inset-*)` resolve on a notched phone.
         No `maximum-scale` or `user-scalable` here: pinch-zoom is an accessibility affordance.
         `main.tsx` adds `maximum-scale=1` on iOS alone, where it stops the focus zoom into a
         field and pinch-zoom survives it. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- Frames may only ever show this deployment's own documents. The Agent draws model-written
         canvases in sandboxed frames; the sandbox removes their origin and network, and
         this is what stops one from navigating itself to another host with the data it was given. -->
    <meta http-equiv="Content-Security-Policy" content="frame-src 'self' blob:" />
    <title>Oh My CPA</title>
    <!-- Injected at runtime by Oh My CPA Go server if present -->
    <script>
      if (!window.__OMCPA_CONFIG__) {
        window.__OMCPA_CONFIG__ = {
          basePath: "",
          apiBaseUrl: "/api/v1",
          mediaBaseUrl: "/media",
          appName: "Oh My CPA"
        };
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
