packages:
  - 'web'
allowBuilds:
  # OpenUI's install hook only sends installation telemetry; the console builds offline.
  '@openuidev/lang-core': false
  esbuild: true
  # The local demonstration server needs its runtime binary fetched at install time.
  workerd: true
minimumReleaseAgeExclude:
  - lucide-react@1.54.0
overrides:
  dompurify: ^3.4.17
  katex: 0.18.2
  sharp: 0.35.5
  source-map-js: 1.2.2
