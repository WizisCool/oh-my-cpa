# Air 热重载配置：`pnpm dev:api`（仅后端）或 `pnpm dev`（后端 + 前端）。
# 后端自己读取 .env，这里不需要注入环境变量。CPA 不由 Air 启动——
# 请自行运行 `pnpm cpa:start` 或使用你自己的 CPA。
root = "."
testdata_dir = "tmp"
tmp_dir = "tmp/air"

[build]
  args_bin = []
  bin = "./tmp/air/main.exe"
  cmd = "go build -o ./tmp/air/main.exe ./cmd/oh-my-cpa"
  delay = 500
  exclude_dir = ["assets", "tmp", "cpa", "web", "docs", "deploy", "scripts", "internal/web/dist"]
  exclude_file = []
  exclude_regex = ["_test\\.go"]
  exclude_unchanged = true
  follow_symlink = false
  full_bin = ""
  include_dir = []
  include_ext = ["go", "sql"]
  kill_delay = "500ms"
  log = "tmp/air/build-errors.log"
  send_interrupt = true
  stop_on_error = true

[color]
  app = ""
  build = "yellow"
  main = "magenta"
  runner = "green"
  watcher = "cyan"

[log]
  time = true
  main_only = false

[misc]
  clean_on_exit = true

[proxy]
  enabled = false
  proxy_port = 0
