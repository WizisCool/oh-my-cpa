title = "Oh My CPA secret scanning"

[extend]
useDefault = true

# `generic-api-key` fires on a Go struct-field comparison in the quota tests:
# `q3.Recommendation.Priority` reads to the entropy heuristic like a key
# assignment. It is an assertion operand, not a credential, so the exact
# expression is allowed by rule + path + value, rather than by disabling the
# rule or excluding the whole test file from scanning.
[[rules]]
id = "generic-api-key"

  [[rules.allowlists]]
  description = "Go struct field comparison in quota recommendation tests"
  condition = "AND"
  paths = ['''internal/quota/service_test\.go''']
  regexTarget = "secret"
  regexes = ['''^q\w+\.Recommendation\.Priority$''']

  # The Claude header-defaults timezone field carries CPA's own template example,
  # `Asia/Singapore`, as its placeholder. A slash-joined word pair crosses the entropy
  # threshold this rule uses, and the placeholder is a timezone name rather than a value:
  # no credential is involved. Allowed by rule + path + value, so the same string stays
  # visible in a file that could plausibly hold a key, and no rule or file is disabled.
  [[rules.allowlists]]
  description = "CPA's own timezone example in the config editor's field placeholder"
  condition = "AND"
  paths = ['''web/src/types/configSchema\.ts''']
  regexTarget = "secret"
  regexes = ['''^Asia/Singapore$''']
