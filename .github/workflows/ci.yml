name: ci

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout full history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Verify repository anchors
        run: |
          git show-ref --verify --quiet refs/tags/pre-overhaul-base-20260904
          git show-ref --verify --quiet refs/tags/handoff/20260904-plan
          test "$(git cat-file -t handoff/20260904-plan)" = tag

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: 1.24.13
          cache: true

      # pnpm has to exist before setup-node runs: `cache: pnpm` resolves the
      # store by executing `pnpm store path`, and the runner image ships npm and
      # Yarn but no pnpm.
      - name: Activate pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.23.2
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify pinned toolchain
        run: pnpm verify:toolchain:strict

      - name: Verify static gates
        run: pnpm verify:static

      - name: Cache gitleaks
        uses: actions/cache@v6
        with:
          path: .tools/gitleaks
          key: gitleaks-${{ runner.os }}-${{ hashFiles('scripts/tools-versions.json') }}

      - name: Scan worktree and history
        run: |
          pnpm verify:secrets:worktree
          pnpm verify:secrets:history

      - name: Verify clean generated state
        run: |
          git diff --check
          test -z "$(git status --porcelain)"

  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: 1.24.13
          cache: true

      - name: Activate pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.23.2
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify pinned toolchain
        run: pnpm verify:toolchain:strict

      - name: Cache Playwright Chromium
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('scripts/tools-versions.json') }}

      # Chromium's OS dependencies and the SPA build touch separate resources.
      # Running them concurrently keeps the browser job's critical path shorter
      # without weakening either step.
      - name: Prepare Chromium and build embedded SPA
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: |
          set -o pipefail
          install_log="$(mktemp)"
          pnpm exec playwright-core install --with-deps chromium >"${install_log}" 2>&1 &
          install_pid=$!
          build_status=0
          pnpm build || build_status=$?
          install_status=0
          wait "${install_pid}" || install_status=$?
          cat "${install_log}"
          if [ "${build_status}" -ne 0 ]; then
            exit "${build_status}"
          fi
          exit "${install_status}"

      - name: Run deterministic browser smoke
        if: github.event_name == 'pull_request'
        run: pnpm verify:browser:smoke

      - name: Run deterministic browser acceptance
        if: github.event_name != 'pull_request'
        run: pnpm verify:browser

      - name: Upload browser failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: browser-acceptance-failure
          path: tmp/browser-acceptance-failure/
          if-no-files-found: ignore
          retention-days: 7

      - name: Verify clean generated state
        run: |
          git diff --check
          test -z "$(git status --porcelain)"
