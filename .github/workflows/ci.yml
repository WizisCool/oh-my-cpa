name: ci

# A pull request runs the lanes its paths reach: the static gates, a browser smoke run
# and the probe scenarios its frontend change selects. The full catalog (built-artifact
# acceptance, the demonstration and every probe) runs on a push to master, on the
# integration pull request from `next`, nightly, on demand, and on a pull request
# labelled `full-ci`. A skipped job reports success, so the required `static`,
# `browser` and `probes` checks stay satisfiable either way.
on:
  push:
    branches: [master, next]
  pull_request:
    branches: [master, next]
    # `labeled` lets adding `full-ci` start the full run without a new commit.
    types: [opened, synchronize, reopened, labeled]
  schedule:
    - cron: '17 19 * * *' # 03:17 Beijing
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  # The event name keeps the nightly run and a push to master from cancelling each other.
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      go: ${{ steps.scope.outputs.go }}
      web: ${{ steps.scope.outputs.web }}
      full: ${{ steps.scope.outputs.full }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Decide the lanes this run needs
        id: scope
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          HEAD_REF: ${{ github.head_ref }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        run: node scripts/ci-scope.mjs >> "$GITHUB_OUTPUT"

  static-go:
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: 1.27.3
          cache: true
      - name: Test
        run: go test ./...
      # golangci-lint's standard set includes vet; .golangci.yml says what it excludes.
      - name: Lint
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.15.0
          "$(go env GOPATH)/bin/golangci-lint" run ./...
      - name: Verify clean generated state
        run: test -z "$(git status --porcelain)"

  static-frontend:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Activate pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.23.4
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Type check, logic, components and antd lint
        run: pnpm verify:static:frontend
      - name: Verify clean generated state
        run: test -z "$(git status --porcelain)"

  # Every event: prose gates, repository scripts, the toolchain pin and the secret scans.
  static-repository:
    needs: changes
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Verify repository anchors
        run: |
          git merge-base --is-ancestor 1d0fd8d85ddee1f2ae5e803453904b23128d6c7d HEAD
          git merge-base --is-ancestor 095b84ab44543ffbeb6c31d900c7e5bc98c16275 HEAD
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: 1.27.3
          cache: true
      - name: Activate pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.23.4
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint workflows
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          pnpm verify:workflow:lint
      - name: Verify pinned toolchain
        run: pnpm verify:toolchain:strict
      - name: Repository gates
        run: pnpm verify:static:repository
      # Every installation's gateway reads the published registry, and a registry-only
      # change reaches no other lane.
      - name: Validate the plugin registry
        run: go test ./internal/pluginregistry -run '^TestPublishedRegistryIsReadable$'
      - name: Cache gitleaks
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: .tools/gitleaks
          key: gitleaks-${{ runner.os }}-${{ hashFiles('scripts/tools-versions.json') }}
      - name: Scan worktree and history
        run: |
          pnpm verify:secrets:worktree
          pnpm verify:secrets:history
      - name: Verify clean generated state
        run: |
          git diff --check
          test -z "$(git status --porcelain)"

  static:
    needs: [changes, static-go, static-frontend, static-repository]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every static lane that ran
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for result in $RESULTS; do
            case "$result" in success|skipped) ;; *) echo "a static lane ended $result"; exit 1 ;; esac
          done

  browser:
    needs: changes
    if: needs.changes.outputs.go == 'true' || needs.changes.outputs.web == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: 1.27.3
          cache: true
      - name: Activate pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.23.4
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Cache Playwright Chromium
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('scripts/tools-versions.json') }}
      # The application binary embeds `internal/web/dist`, so it is compiled only after
      # `pnpm build` has finished writing it; Chromium's install overlaps the build.
      - name: Prepare Chromium and build embedded SPA
        id: prepare
        run: |
          set -o pipefail
          node scripts/install-chromium.mjs > tmp-install.log 2>&1 &
          install_pid=$!
          pnpm build
          mkdir -p tmp
          CGO_ENABLED=0 go build -trimpath -o tmp/seed-usage-browser ./scripts/fixture/seed-usage
          CGO_ENABLED=0 go build -trimpath -o tmp/oh-my-cpa-browser ./cmd/oh-my-cpa
          install_status=0
          wait "${install_pid}" || install_status=$?
          cat tmp-install.log && rm tmp-install.log
          exit "${install_status}"
      - name: Verify loading boundaries and report bundle growth
        env:
          BUNDLE_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          GH_TOKEN: ${{ github.token }}
        run: pnpm check:bundle
      - name: Built-artifact smoke
        if: needs.changes.outputs.full != 'true'
        env:
          OMCPA_BROWSER_BINARY: tmp/oh-my-cpa-browser
          OMCPA_SEED_USAGE_BINARY: tmp/seed-usage-browser
        run: pnpm verify:browser:smoke
      - name: Full built-artifact acceptance
        if: needs.changes.outputs.full == 'true'
        env:
          OMCPA_BROWSER_BINARY: tmp/oh-my-cpa-browser
          OMCPA_SEED_USAGE_BINARY: tmp/seed-usage-browser
        run: pnpm verify:browser
      - name: The demonstration's browser acceptance
        if: needs.changes.outputs.full == 'true'
        run: pnpm verify:demo
      - name: Upload bundle report
        if: always() && steps.prepare.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: bundle-report
          path: |
            tmp/bundle/report.json
            tmp/bundle/summary.md
          if-no-files-found: ignore
          retention-days: 30
      - name: Upload browser failure diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: browser-acceptance-failure
          path: tmp/browser-acceptance-failure/
          if-no-files-found: ignore
          retention-days: 7
      - name: Verify clean generated state
        run: |
          git diff --check
          test -z "$(git status --porcelain)"

  # The probes drive the Vite dev server with mocked routes, so only a frontend or probe
  # change can move them. A pull request runs the scenarios its paths select.
  probes-affected:
    needs: changes
    if: needs.changes.outputs.web == 'true' && needs.changes.outputs.full != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Activate pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.23.4
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Cache Playwright Chromium
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('scripts/tools-versions.json') }}
      - name: Install Chromium
        run: node scripts/install-chromium.mjs
      - name: Run the affected scenarios
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: pnpm check:ui --base "${BASE}"
      - name: Upload probe failure diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: probe-failure-affected
          path: tmp/probe-failure/
          if-no-files-found: ignore
          retention-days: 7

  probes-full:
    needs: changes
    if: needs.changes.outputs.full == 'true'
    name: probes-full (${{ matrix.shard }}/3)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Activate pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.23.4
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Cache Playwright Chromium
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('scripts/tools-versions.json') }}
      - name: Install Chromium
        run: node scripts/install-chromium.mjs
      - name: Run the probe shard
        run: pnpm verify:probes --shard ${{ matrix.shard }}/3
      - name: Upload probe failure diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: probe-failure-${{ matrix.shard }}
          path: tmp/probe-failure/
          if-no-files-found: ignore
          retention-days: 7

  probes:
    needs: [changes, probes-affected, probes-full]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every probe job that ran
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for result in $RESULTS; do
            case "$result" in success|skipped) ;; *) echo "a probe job ended $result"; exit 1 ;; esac
          done
