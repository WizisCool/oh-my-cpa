name: ci

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read
  actions: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Every gate that does not need the whole stack. Both jobs install the same
  # toolchain, so the two run in parallel rather than chaining: the browser job's
  # critical path is its own setup plus one SPA build, and making it wait for the
  # static job would add that job's whole duration to the feedback the pull request
  # actually waits on.
  static:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Verify repository anchors
        run: |
          # Assert foundational beta baseline and overhaul roadmap commits remain ancestors of HEAD.
          git merge-base --is-ancestor 1d0fd8d85ddee1f2ae5e803453904b23128d6c7d HEAD
          git merge-base --is-ancestor 095b84ab44543ffbeb6c31d900c7e5bc98c16275 HEAD

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: 1.27.1
          cache: true

      # pnpm has to exist before setup-node runs: `cache: pnpm` resolves the
      # store by executing `pnpm store path`, and the runner image ships npm and
      # Yarn but no pnpm.
      - name: Activate pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.23.2
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate Actions syntax and expressions
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          pnpm verify:workflow:lint

      - name: Verify pinned toolchain
        run: pnpm verify:toolchain:strict

      - name: Verify static gates
        run: pnpm verify:static

      - name: Cache gitleaks
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: .tools/gitleaks
          key: gitleaks-${{ runner.os }}-${{ hashFiles('scripts/tools-versions.json') }}

      - name: Scan worktree and history
        run: |
          pnpm verify:secrets:worktree
          pnpm verify:secrets:history

      - name: Verify clean generated state
        run: |
          git diff --check
          git status --short
          test -z "$(git status --porcelain)"

  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: 1.27.1
          cache: true

      - name: Activate pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.23.2
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify pinned toolchain
        run: pnpm verify:toolchain:strict

      # A cache hit proves the browser *files* are present, never that the runner
      # has the shared libraries Chromium links against, so the OS dependencies are
      # still guaranteed - but by a launch probe rather than unconditionally. On a
      # runner image that already carries them, `--with-deps` was about 100 seconds of
      # apt work that proved nothing; `scripts/install-chromium.mjs` downloads the
      # browser, tries a real launch, and installs the dependencies only when that
      # launch fails. The fallback is the previous command, so the worst case is the
      # old cost rather than a new failure mode, and a second launch failure is
      # reported instead of ignored.
      - name: Cache Playwright Chromium
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('scripts/tools-versions.json') }}

      # The SPA build and Chromium's install touch separate resources, so they run
      # concurrently, and the Go binaries are built *after* `pnpm build` completes.
      #
      # The application binary must come after, because it embeds
      # `internal/web/dist`: compiling it while the SPA build rewrites that directory
      # can embed a half-written bundle. That is a correctness constraint.
      #
      # The seeder does not embed the SPA and could start earlier, but it is left in
      # the same post-build group on purpose. Two `go build` calls sharing one module
      # and build cache contend on the same lock, and measured with a cold cache they
      # cost 34s together against 23s for the application binary alone plus about 5s
      # for the seeder serially - running them "in parallel" is slower. Chromium's
      # install is the genuinely independent third resource, and it is already
      # overlapped.
      - name: Prepare Chromium and build embedded SPA
        id: prepare
        run: |
          set -o pipefail
          install_log="$(mktemp)"
          node scripts/install-chromium.mjs >"${install_log}" 2>&1 &
          install_pid=$!
          build_status=0
          pnpm build || build_status=$?
          go_status=0
          if [ "${build_status}" -eq 0 ]; then
            mkdir -p tmp
            CGO_ENABLED=0 go build -trimpath -o tmp/seed-usage-browser ./scripts/fixture/seed-usage &
            seed_build_pid=$!
            CGO_ENABLED=0 go build -trimpath -o tmp/oh-my-cpa-browser ./cmd/oh-my-cpa
            go_status=$?
            wait "${seed_build_pid}" || go_status=$?
          fi
          install_status=0
          wait "${install_pid}" || install_status=$?
          cat "${install_log}"
          if [ "${build_status}" -ne 0 ]; then
            exit "${build_status}"
          fi
          if [ "${go_status}" -ne 0 ]; then
            exit "${go_status}"
          fi
          exit "${install_status}"

      # Keep production acceptance observable even when a loading boundary or size
      # ceiling fails. The final verdict below still makes that failure blocking.
      - name: Verify loading boundaries and report bundle growth
        id: bundle
        continue-on-error: true
        env:
          BUNDLE_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          GH_TOKEN: ${{ github.token }}
        run: pnpm check:bundle

      - name: Verify generated state before browser tests
        run: |
          git diff --check
          git status --short
          test -z "$(git status --porcelain)"

      # The fixture is stateful; one full pass avoids a second selector contract.
      - name: Verify browser harness fault detection
        run: pnpm verify:browser:harness
      - name: Run full built-artifact acceptance on every event
        env:
          OMCPA_BROWSER_BINARY: tmp/oh-my-cpa-browser
          OMCPA_SEED_USAGE_BINARY: tmp/seed-usage-browser
        run: pnpm verify:browser

      # The public demonstration is a separate deployment of the same console, so a
      # change can break it while every self-hosted gate stays green. It runs after the
      # acceptance step rather than beside it, keeping that step's resource budget
      # stable. It serves the real Worker handler in-process against the built
      # console and waits for each route's responses and visible content.
      - name: Run the demonstration's browser acceptance
        run: pnpm verify:demo

      - name: Upload bundle report
        if: always() && steps.prepare.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: bundle-report
          path: |
            tmp/bundle/report.json
            tmp/bundle/summary.md
          if-no-files-found: error
          retention-days: 30

      - name: Upload browser failure diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: browser-acceptance-failure
          path: |
            tmp/browser-acceptance-failure/
            tmp/browser-harness-failure/
          if-no-files-found: ignore
          retention-days: 7

      - name: Verify clean generated state
        run: |
          git diff --check
          git status --short
          test -z "$(git status --porcelain)"

      - name: Require bundle verification success
        if: always() && steps.prepare.outcome == 'success'
        env:
          BUNDLE_OUTCOME: ${{ steps.bundle.outcome }}
        run: test "${BUNDLE_OUTCOME}" = success

  # The browser-only probe catalog: every scenario, on every pull request and on
  # master. It drives the Vite dev server with mocked routes, so it needs neither a
  # build nor Go, and it is split into weight-balanced disjoint shards
  # (`scripts/acceptance/probe-shards.mjs`) that run on separate runners - one browser
  # per machine, so the scenarios' timing-sensitive checks see no added contention.
  probes:
    name: probes (${{ matrix.shard }}/3)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Activate pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.23.2
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache Playwright Chromium
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('scripts/tools-versions.json') }}

      - name: Install Chromium
        run: node scripts/install-chromium.mjs

      - name: Run the probe shard
        run: pnpm verify:probes --shard ${{ matrix.shard }}/3

      - name: Upload probe timings
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: probe-timings-${{ matrix.shard }}
          path: tmp/probe-timings/
          if-no-files-found: error
          retention-days: 30

      - name: Upload probe failure diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: probe-failure-${{ matrix.shard }}
          path: tmp/probe-failure/
          if-no-files-found: ignore
          retention-days: 7

      - name: Verify clean generated state
        run: |
          git diff --check
          git status --short
          test -z "$(git status --porcelain)"

  # One stable check name for branch protection, whatever the shard count. It runs
  # even when a shard failed or was cancelled, and passes only if every shard passed.
  probes-complete:
    name: probes
    needs: probes
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every probe shard
        env:
          PROBES_RESULT: ${{ needs.probes.result }}
        run: test "${PROBES_RESULT}" = success
