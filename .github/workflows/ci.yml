name: ci

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Every gate that does not need the whole stack. Both jobs install the same
  # toolchain, so the two run in parallel rather than chaining: the browser job's
  # critical path is its own setup plus one SPA build, and making it wait for the
  # static job would add that job's whole duration to the feedback the pull request
  # actually waits on.
  static:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout full history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Verify repository anchors
        run: |
          git show-ref --verify --quiet refs/tags/pre-overhaul-base-20260904
          git show-ref --verify --quiet refs/tags/handoff/20260904-plan
          test "$(git cat-file -t handoff/20260904-plan)" = tag

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: 1.24.13
          cache: true

      # pnpm has to exist before setup-node runs: `cache: pnpm` resolves the
      # store by executing `pnpm store path`, and the runner image ships npm and
      # Yarn but no pnpm.
      - name: Activate pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.23.2
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify pinned toolchain
        run: pnpm verify:toolchain:strict

      - name: Verify static gates
        run: pnpm verify:static

      - name: Cache gitleaks
        uses: actions/cache@v6
        with:
          path: .tools/gitleaks
          key: gitleaks-${{ runner.os }}-${{ hashFiles('scripts/tools-versions.json') }}

      - name: Scan worktree and history
        run: |
          pnpm verify:secrets:worktree
          pnpm verify:secrets:history

      - name: Verify clean generated state
        run: |
          git diff --check
          test -z "$(git status --porcelain)"

  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: 1.24.13
          cache: true

      - name: Activate pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.23.2
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify pinned toolchain
        run: pnpm verify:toolchain:strict

      # A cache hit proves the browser *files* are present, never that the runner
      # has the shared libraries Chromium links against. `--with-deps` is therefore
      # unconditional and its result is checked, while the download itself is what
      # the cache saves.
      - name: Cache Playwright Chromium
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('scripts/tools-versions.json') }}

      # Chromium's OS dependencies and the SPA build touch separate resources, so
      # they run concurrently. The Go binaries are built *after* `pnpm build`
      # completes and never beside it: the application binary embeds
      # `internal/web/dist`, so compiling it while the SPA build is rewriting that
      # directory can embed a half-written bundle.
      #
      # The seeder does not embed the SPA and is started as soon as the SPA build
      # finishes, in parallel with the application build.
      - name: Prepare Chromium and build embedded SPA
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: |
          set -o pipefail
          install_log="$(mktemp)"
          pnpm exec playwright-core install --with-deps chromium >"${install_log}" 2>&1 &
          install_pid=$!
          build_status=0
          pnpm build || build_status=$?
          go_status=0
          if [ "${build_status}" -eq 0 ]; then
            mkdir -p tmp
            CGO_ENABLED=0 go build -trimpath -o tmp/seed-usage-browser ./scripts/fixture/seed-usage &
            seed_build_pid=$!
            CGO_ENABLED=0 go build -trimpath -o tmp/oh-my-cpa-browser ./cmd/oh-my-cpa
            go_status=$?
            wait "${seed_build_pid}" || go_status=$?
          fi
          install_status=0
          wait "${install_pid}" || install_status=$?
          cat "${install_log}"
          if [ "${build_status}" -ne 0 ]; then
            exit "${build_status}"
          fi
          if [ "${go_status}" -ne 0 ]; then
            exit "${go_status}"
          fi
          exit "${install_status}"

      # Pull requests get the thin cross-stack smoke: the redirect, sign-in, and
      # that the dashboard and the request list render their seeded rows without a
      # console or page error. Everything else a browser can prove is in the two
      # master steps below.
      - name: Run deterministic browser smoke
        if: github.event_name == 'pull_request'
        env:
          OMCPA_BROWSER_BINARY: tmp/oh-my-cpa-browser
          OMCPA_SEED_USAGE_BINARY: tmp/seed-usage-browser
        run: pnpm verify:browser:smoke

      # Master keeps both browser phases. The acceptance run drives the whole stack
      # against the fake CPA; the probe run adds the geometry, stacking, paint and
      # refresh-sequencing assertions that no pure test can make.
      - name: Run deterministic browser acceptance
        if: github.event_name != 'pull_request'
        env:
          OMCPA_BROWSER_BINARY: tmp/oh-my-cpa-browser
          OMCPA_SEED_USAGE_BINARY: tmp/seed-usage-browser
        run: pnpm verify:browser

      - name: Run focused browser probes
        if: github.event_name != 'pull_request'
        run: pnpm verify:probes

      - name: Upload browser failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: browser-acceptance-failure
          path: |
            tmp/browser-acceptance-failure/
            tmp/probe-failure/
          if-no-files-found: ignore
          retention-days: 7

      - name: Verify clean generated state
        run: |
          git diff --check
          test -z "$(git status --porcelain)"
