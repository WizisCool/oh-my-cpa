name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled]
  schedule:
    - cron: '17 19 * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  static-go:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Go
        uses: ./.github/actions/setup-go
      - name: Test
        run: go test ./...
      - name: Lint
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.15.0
          "$(go env GOPATH)/bin/golangci-lint" run ./...
      - name: Verify clean generated state
        run: test -z "$(git status --porcelain)"

  static-frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Set up Go
        uses: ./.github/actions/setup-go
      - name: Set up JavaScript workspace
        uses: ./.github/actions/setup-node
      - name: Cache verification tools
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            .tools/gitleaks
            .tools/lychee
          key: verification-tools-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/tools-versions.json') }}
      - name: Lint workflows
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          pnpm verify:workflow:lint
      - name: Verify pinned toolchain
        run: pnpm verify:toolchain:strict
      - name: Type check, unit/component tests, and Ant Design lint
        run: pnpm verify:static:frontend
      - name: Repository gates and documentation links
        run: |
          pnpm verify:static:repository
          pnpm check-docs
      - name: Scan worktree and history
        run: |
          pnpm verify:secrets:worktree
          pnpm verify:secrets:history
      - name: Verify clean generated state
        run: |
          git diff --check
          test -z "$(git status --porcelain)"

  static:
    needs: [static-go, static-frontend]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require all static gates
        env:
          GO_RESULT: ${{ needs.static-go.result }}
          WEB_RESULT: ${{ needs.static-frontend.result }}
        run: |
          test "$GO_RESULT" = success
          test "$WEB_RESULT" = success

  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Go
        uses: ./.github/actions/setup-go
      - name: Set up JavaScript workspace
        uses: ./.github/actions/setup-node
      - name: Set up Chromium
        uses: ./.github/actions/setup-browser
      - name: Build embedded SPA and browser fixtures
        id: prepare
        run: |
          set -o pipefail
          (
            ulimit -Sn 1024
            ulimit -Hn 1024
            pnpm build
          )
          mkdir -p tmp
          CGO_ENABLED=0 go build -trimpath -o tmp/seed-usage-browser ./scripts/fixture/seed-usage
          CGO_ENABLED=0 go build -trimpath -o tmp/oh-my-cpa-browser ./cmd/oh-my-cpa
      - name: Verify loading boundaries and report bundle growth
        env:
          BUNDLE_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          GH_TOKEN: ${{ github.token }}
        run: pnpm check:bundle
      - name: Built-artifact browser acceptance
        env:
          OMCPA_BROWSER_BINARY: tmp/oh-my-cpa-browser
          OMCPA_SEED_USAGE_BINARY: tmp/seed-usage-browser
          IS_PR: ${{ github.event_name == 'pull_request' }}
          HAS_FULL_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'full-ci') }}
        run: |
          if [ "$IS_PR" = "true" ] && [ "$HAS_FULL_LABEL" != "true" ]; then
            pnpm verify:browser:smoke
          else
            pnpm verify:browser
          fi
      - name: Upload bundle report
        if: always() && steps.prepare.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: bundle-report
          path: |
            tmp/bundle/report.json
            tmp/bundle/summary.md
          if-no-files-found: ignore
          retention-days: 30
      - name: Upload browser failure diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: browser-acceptance-failure
          path: tmp/browser-acceptance-failure/
          if-no-files-found: ignore
          retention-days: 7
      - name: Verify clean generated state
        run: |
          git diff --check
          test -z "$(git status --porcelain)"

  verify:
    needs: [static, browser]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require all verification lanes
        env:
          STATIC: ${{ needs.static.result }}
          BROWSER: ${{ needs.browser.result }}
        run: |
          test "$STATIC" = success
          test "$BROWSER" = success
