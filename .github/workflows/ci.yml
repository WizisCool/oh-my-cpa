name: ci

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify repository anchors
        run: |
          git show-ref --verify --quiet refs/tags/pre-overhaul-base-20260904
          git show-ref --verify --quiet refs/tags/handoff/20260904-plan
          test "$(git cat-file -t handoff/20260904-plan)" = tag

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.24.13
          cache: true

      # pnpm has to exist before setup-node runs: `cache: pnpm` resolves the
      # store by executing `pnpm store path`, and the runner image ships npm and
      # Yarn but no pnpm.
      - name: Activate pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify pinned toolchain
        run: pnpm verify:toolchain:strict

      - name: Verify static gates
        run: pnpm verify:static

      - name: Scan worktree and history
        run: |
          pnpm verify:secrets:worktree
          pnpm verify:secrets:history

      - name: Verify clean generated state
        run: |
          git diff --check
          test -z "$(git status --porcelain)"

  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.24.13
          cache: true

      - name: Activate pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify pinned toolchain
        run: pnpm verify:toolchain:strict

      - name: Cache Playwright Chromium
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('scripts/tools-versions.json') }}

      - name: Install Chromium
        run: pnpm exec playwright-core install --with-deps chromium

      - name: Build embedded SPA
        # The production build peaks above Node's default old-space limit on a
        # 7 GB runner, so the heap is raised for this step only.
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: pnpm build

      - name: Run deterministic browser smoke
        if: github.event_name == 'pull_request'
        run: pnpm verify:browser:smoke

      - name: Run deterministic browser acceptance
        if: github.event_name != 'pull_request'
        run: pnpm verify:browser

      - name: Verify clean generated state
        run: |
          git diff --check
          test -z "$(git status --porcelain)"
