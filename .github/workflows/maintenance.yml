name: Maintenance verification
on:
  schedule:
    - cron: '23 3 * * 1'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: maintenance-${{ github.ref }}
  cancel-in-progress: true
jobs:
  robustness:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        mode: [race, fuzz, advisories]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.23.2
          cache: pnpm
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: 1.27.1
      - run: pnpm install --frozen-lockfile
      - run: node scripts/maintenance-checks.mjs ${{ matrix.mode }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: maintenance-${{ matrix.mode }}
          path: tmp/maintenance/
          if-no-files-found: error
          retention-days: 30
  native-runtime:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-2025]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with:
          cache: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.23.2
          package-manager-cache: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: 1.27.1
          cache: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Compile and execute the host-native distribution
        shell: bash
        env:
          CGO_ENABLED: '0'
        run: |
          mkdir -p tmp
          binary=tmp/native-smoke
          if [ "$RUNNER_OS" = Windows ]; then binary=tmp/native-smoke.exe; fi
          go build -trimpath -tags timetzdata -o "$binary" ./cmd/oh-my-cpa
          node scripts/native-runtime-smoke.mjs "$binary"
