name: Release
on:
  push:
    tags:
      - v*
  workflow_dispatch:
    inputs:
      tag:
        description: Existing stable version tag to publish or resume
        required: true
        type: string
permissions:
  contents: read
env:
  CGO_ENABLED: '0'
concurrency:
  group: docker-hub-release
  queue: max
  cancel-in-progress: false
jobs:
  identity:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.plan.outputs.tag }}
      revision: ${{ steps.plan.outputs.revision }}
      image: ${{ steps.plan.outputs.image }}
      tags: ${{ steps.plan.outputs.version_tags }}
      is_latest: ${{ steps.plan.outputs.is_latest }}
      split_native: ${{ steps.plan.outputs.split_native }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ inputs.tag || github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.23.4
          package-manager-cache: false
      - name: Validate release identity and latest policy
        id: plan
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
          RELEASE_IMAGE: wiziscool/oh-my-cpa
          RELEASE_INDEX: /tmp/omc-releases.json
          GH_TOKEN: ${{ github.token }}
        run: |
          # The default shell ignores a failed producer in a pipe, and an inventory that failed
          # to download reads as "no releases", which would let an old tag claim latest.
          set -o pipefail
          test "$(git describe --tags --exact-match)" = "$RELEASE_TAG"
          gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq '.[]' | jq -s . > "$RELEASE_INDEX"
          node scripts/release-plan.mjs
          echo "revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          if grep -q -- '--web-only' scripts/native-release.mjs && grep -q -- '--finalize' scripts/native-release.mjs; then
            echo "split_native=true" >> "$GITHUB_OUTPUT"
          else
            echo "split_native=false" >> "$GITHUB_OUTPUT"
          fi

  static-go:
    needs: identity
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ needs.identity.outputs.revision }}
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: 1.27.3
          cache: true
      - name: Cache Go linter
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            .tools/bin/golangci-lint
            ~/.cache/golangci-lint
          key: golangci-lint-${{ runner.os }}-${{ runner.arch }}-v2.15.0-${{ hashFiles('.golangci.yml', 'go.sum') }}
          restore-keys: |
            golangci-lint-${{ runner.os }}-${{ runner.arch }}-v2.15.0-
      - name: Test and vet
        run: go test ./... && go vet ./...
      - name: Lint
        run: |
          if [ ! -x .tools/bin/golangci-lint ]; then
            mkdir -p .tools/bin
            GOBIN="$PWD/.tools/bin" go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.15.0
          fi
          .tools/bin/golangci-lint run ./...
      - name: Verify clean generated state
        run: test -z "$(git status --porcelain)"

  static-frontend:
    needs: identity
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ needs.identity.outputs.revision }}
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: 1.27.3
          cache: true
      - name: Activate pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.23.4
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Cache verification tools
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            .tools/gitleaks
            .tools/lychee
            .tools/bin/actionlint
          key: verification-tools-${{ runner.os }}-${{ runner.arch }}-actionlint-v1.7.12-${{ hashFiles('scripts/tools-versions.json') }}
      - name: Validate Actions syntax and expressions
        env:
          ACTIONLINT_BIN: .tools/bin/actionlint
        run: |
          if [ ! -x .tools/bin/actionlint ]; then
            mkdir -p .tools/bin
            GOBIN="$PWD/.tools/bin" go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          fi
          pnpm verify:workflow:lint
      - name: Verify pinned toolchain
        run: pnpm verify:toolchain:strict
      - name: Check offline documentation links and fragments
        run: pnpm check-docs
      - name: Verify frontend and repository gates
        run: |
          pnpm verify:static:frontend
          pnpm verify:static:repository
      - name: Scan worktree and history
        run: |
          pnpm verify:secrets:worktree
          pnpm verify:secrets:history
      - name: Verify clean generated state
        run: |
          git diff --check
          git status --short
          test -z "$(git status --porcelain)"

  browser:
    needs: identity
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ needs.identity.outputs.revision }}
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: 1.27.3
          cache: true
      - name: Activate pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.23.4
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify pinned toolchain
        run: pnpm verify:toolchain:strict
      - name: Cache Playwright Chromium
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/tools-versions.json') }}
      - name: Prepare Chromium and build embedded SPA
        id: prepare
        run: |
          set -o pipefail
          install_log="$(mktemp)"
          node scripts/install-chromium.mjs >"${install_log}" 2>&1 &
          install_pid=$!
          mkdir -p tmp
          go build -trimpath -o tmp/seed-usage-browser ./scripts/fixture/seed-usage &
          seed_build_pid=$!
          build_status=0
          (
            ulimit -Sn 1024
            ulimit -Hn 1024
            pnpm build
          ) || build_status=$?
          go_status=0
          if [ "${build_status}" -eq 0 ]; then
            go build -trimpath -o tmp/oh-my-cpa-browser ./cmd/oh-my-cpa || go_status=$?
          fi
          seed_status=0
          wait "${seed_build_pid}" || seed_status=$?
          install_status=0
          wait "${install_pid}" || install_status=$?
          cat "${install_log}"
          if [ "${build_status}" -ne 0 ]; then
            exit "${build_status}"
          fi
          if [ "${go_status}" -ne 0 ]; then
            exit "${go_status}"
          fi
          if [ "${seed_status}" -ne 0 ]; then
            exit "${seed_status}"
          fi
          exit "${install_status}"
      - name: Verify loading boundaries and report bundle growth
        id: bundle
        continue-on-error: true
        env:
          # No previous release baseline is resolved here; growth is explicitly unavailable.
          BUNDLE_BASE_SHA: ''
          GH_TOKEN: ${{ github.token }}
        run: pnpm check:bundle
      - name: Verify generated state before browser tests
        run: |
          git diff --check
          git status --short
          test -z "$(git status --porcelain)"
      - name: Run full built-artifact acceptance
        env:
          OMCPA_BROWSER_BINARY: tmp/oh-my-cpa-browser
          OMCPA_SEED_USAGE_BINARY: tmp/seed-usage-browser
        run: pnpm verify:browser
      - name: Upload bundle report
        if: always() && steps.prepare.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: release-bundle-report
          path: |
            tmp/bundle/report.json
            tmp/bundle/summary.md
          if-no-files-found: error
          retention-days: 30
      - name: Upload browser failure diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: browser-acceptance-failure
          path: |
            tmp/browser-acceptance-failure/
          if-no-files-found: ignore
          retention-days: 7
      - name: Verify clean generated state
        run: |
          git diff --check
          git status --short
          test -z "$(git status --porcelain)"
      - name: Require bundle verification success
        if: always() && steps.prepare.outcome == 'success'
        env:
          BUNDLE_OUTCOME: ${{ steps.bundle.outcome }}
        run: test "${BUNDLE_OUTCOME}" = success

  native-web:
    needs: identity
    if: needs.identity.outputs.split_native == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ needs.identity.outputs.revision }}
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with:
          cache: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.23.4
          package-manager-cache: false
      - name: Require unchanged release tag
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.identity.outputs.tag }}
          RELEASE_REVISION: ${{ needs.identity.outputs.revision }}
        run: node scripts/release-identity.mjs
      - run: pnpm install --frozen-lockfile
      - name: Build and validate embedded console once
        env:
          RELEASE_TAG: ${{ needs.identity.outputs.tag }}
        run: node scripts/native-release.mjs --web-only
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: native-web-dist
          path: internal/web/dist
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  native-build:
    needs:
      - identity
      - native-web
    if: needs.identity.outputs.split_native == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: true
      matrix:
        include:
          - target: darwin/amd64
            slug: darwin-amd64
          - target: darwin/arm64
            slug: darwin-arm64
          - target: windows/amd64
            slug: windows-amd64
          - target: windows/arm64
            slug: windows-arm64
          - target: linux/amd64
            slug: linux-amd64
          - target: linux/arm64
            slug: linux-arm64
          - target: freebsd/amd64
            slug: freebsd-amd64
          - target: freebsd/arm64
            slug: freebsd-arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ needs.identity.outputs.revision }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.23.4
          package-manager-cache: false
      - name: Require unchanged release tag
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.identity.outputs.tag }}
          RELEASE_REVISION: ${{ needs.identity.outputs.revision }}
        run: node scripts/release-identity.mjs
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: 1.27.3
          cache: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: native-web-dist
          path: internal/web/dist
      - name: Build and package target archive
        env:
          RELEASE_TAG: ${{ needs.identity.outputs.tag }}
        run: node scripts/native-release.mjs --target "${{ matrix.target }}" --skip-web-build
      - name: Require clean generated state
        run: test -z "$(git status --porcelain)"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: native-target-${{ matrix.slug }}
          path: tmp/native-release/*
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  native:
    needs:
      - identity
      - native-build
    if: always() && needs.identity.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ needs.identity.outputs.revision }}
      - name: Require split native builds when enabled
        if: needs.identity.outputs.split_native == 'true'
        env:
          NATIVE_BUILD_RESULT: ${{ needs.native-build.result }}
        run: test "$NATIVE_BUILD_RESULT" = success
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.23.4
          package-manager-cache: false
      - name: Require unchanged release tag
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.identity.outputs.tag }}
          RELEASE_REVISION: ${{ needs.identity.outputs.revision }}
        run: node scripts/release-identity.mjs
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        if: needs.identity.outputs.split_native == 'true'
        with:
          pattern: native-target-*
          merge-multiple: true
          path: tmp/native-release
      - name: Finalize installation assets and checksums
        if: needs.identity.outputs.split_native == 'true'
        env:
          RELEASE_TAG: ${{ needs.identity.outputs.tag }}
        run: node scripts/native-release.mjs --finalize
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        if: needs.identity.outputs.split_native != 'true'
        with:
          cache: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        if: needs.identity.outputs.split_native != 'true'
        with:
          go-version: 1.27.3
          cache: false
      - name: Build legacy native archives from tag source
        if: needs.identity.outputs.split_native != 'true'
        env:
          RELEASE_TAG: ${{ needs.identity.outputs.tag }}
        run: |
          pnpm install --frozen-lockfile
          node scripts/native-release.mjs
      - name: Verify the extracted native package
        env:
          RELEASE_TAG: ${{ needs.identity.outputs.tag }}
        run: node scripts/native-release-smoke.mjs
      - name: Require clean generated state
        run: test -z "$(git status --porcelain)"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: native-release
          path: tmp/native-release/*
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    needs:
      - identity
      - static-go
      - static-frontend
      - browser
      - native
    if: always()
    outputs:
      tag: ${{ needs.identity.outputs.tag }}
      revision: ${{ needs.identity.outputs.revision }}
      image: ${{ needs.identity.outputs.image }}
      tags: ${{ needs.identity.outputs.tags }}
      is_latest: ${{ needs.identity.outputs.is_latest }}
    steps:
      - name: Require all release verification and candidate packaging
        env:
          IDENTITY: ${{ needs.identity.result }}
          STATIC_GO: ${{ needs.static-go.result }}
          STATIC_FRONTEND: ${{ needs.static-frontend.result }}
          BROWSER: ${{ needs.browser.result }}
          NATIVE: ${{ needs.native.result }}
        run: |-
          test "$IDENTITY" = success
          test "$STATIC_GO" = success
          test "$STATIC_FRONTEND" = success
          test "$BROWSER" = success
          test "$NATIVE" = success

  publish:
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    outputs:
      digest: ${{ steps.image.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ needs.verify.outputs.revision }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.23.4
          package-manager-cache: false
      - name: Require unchanged release tag
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.verify.outputs.tag }}
          RELEASE_REVISION: ${{ needs.verify.outputs.revision }}
        run: node scripts/release-identity.mjs
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
      - name: Build native acceptance image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: oh-my-cpa:release-test
          build-args: |
            VERSION=${{ needs.verify.outputs.tag }}
            REVISION=${{ needs.verify.outputs.revision }}
      - name: Verify packaged image, permissions, base paths and running version
        env:
          RELEASE_TAG: ${{ needs.verify.outputs.tag }}
        run: node scripts/docker-smoke.mjs oh-my-cpa:release-test
      - name: Sign in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          username: wiziscool
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Recheck tag at publication boundary
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.verify.outputs.tag }}
          RELEASE_REVISION: ${{ needs.verify.outputs.revision }}
        run: node scripts/release-identity.mjs
      - name: Build and push multi-platform release
        id: image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ needs.verify.outputs.tags }}
          build-args: |
            VERSION=${{ needs.verify.outputs.tag }}
            REVISION=${{ needs.verify.outputs.revision }}
          provenance: mode=max
          sbom: true

  release:
    needs:
      - verify
      - publish
      - native
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ needs.verify.outputs.revision }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.23.4
          package-manager-cache: false
      - name: Require unchanged release tag
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.verify.outputs.tag }}
          RELEASE_REVISION: ${{ needs.verify.outputs.revision }}
        run: node scripts/release-identity.mjs
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: native-release
          path: tmp/native-release
      - name: Recheck tag at publication boundary
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.verify.outputs.tag }}
          RELEASE_REVISION: ${{ needs.verify.outputs.revision }}
        run: node scripts/release-identity.mjs
      - name: Publish installation assets and release notes
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.verify.outputs.tag }}
          RELEASE_IMAGE: ${{ needs.verify.outputs.image }}
          RELEASE_DIGEST: ${{ needs.publish.outputs.digest }}
          RELEASE_INDEX: /tmp/omc-releases.json
          RELEASE_REVISION: ${{ needs.verify.outputs.revision }}
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: |
          # The default shell ignores a failed producer in a pipe, and an inventory that failed
          # to download reads as "no releases", which would let an old tag claim latest.
          set -o pipefail
          node scripts/native-release.mjs --verify
          # Signed after the asset matrix is verified and before anything is attached, so a
          # release never becomes visible without the manifest console updates depend on.
          node scripts/sign-release-manifest.mjs tmp/native-release
          # Recompute at publication: retries can run after a newer release completed.
          gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq '.[]' | jq -s . > "$RELEASE_INDEX"
          printf 'Docker Hub: `%s:%s`\n\nMulti-platform digest: `%s@%s`\n\nDocker platforms: `linux/amd64`, `linux/arm64`.\n\nNative executables: Darwin, Windows, Linux and FreeBSD, each on amd64 and arm64. Archives embed the console; verify downloads with `checksums.txt`.\n\nSee [installation](https://github.com/%s/blob/%s/docs/install.md) and the [agent guide](https://github.com/%s/blob/%s/docs/install-for-agents.md).\n' \
            "$RELEASE_IMAGE" "$RELEASE_TAG" "$RELEASE_IMAGE" "$RELEASE_DIGEST" "$GITHUB_REPOSITORY" "$RELEASE_TAG" "$GITHUB_REPOSITORY" "$RELEASE_TAG" > /tmp/release-notes.md
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" tmp/native-release/* --clobber
          else
            gh release create "$RELEASE_TAG" tmp/native-release/* \
              --verify-tag --title "$RELEASE_TAG" --notes-file /tmp/release-notes.md \
              --generate-notes --draft --latest=false
          fi
          # Attachments must finish before a new release becomes visible to update checks.
          gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq '.[]' | jq -s . > "$RELEASE_INDEX"
          IS_LATEST=$(node scripts/release-plan.mjs | jq -r .isLatest)
          node scripts/release-identity.mjs
          gh release edit "$RELEASE_TAG" --draft=false --latest="$IS_LATEST"

  promote:
    needs:
      - verify
      - publish
      - release
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ needs.verify.outputs.revision }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.23.4
          package-manager-cache: false
      - name: Require unchanged release tag
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.verify.outputs.tag }}
          RELEASE_REVISION: ${{ needs.verify.outputs.revision }}
        run: node scripts/release-identity.mjs
      - name: Recheck newest stable release before moving Docker latest
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.verify.outputs.tag }}
          RELEASE_IMAGE: ${{ needs.verify.outputs.image }}
          RELEASE_INDEX: /tmp/omc-releases.json
        run: |
          # The default shell ignores a failed producer in a pipe, and an inventory that failed
          # to download reads as "no releases", which would let an old tag claim latest.
          set -o pipefail
          gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq '.[]' | jq -s . > "$RELEASE_INDEX"
          node scripts/release-plan.mjs
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
        if: steps.plan.outputs.is_latest == 'true'
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        if: steps.plan.outputs.is_latest == 'true'
        with:
          username: wiziscool
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Recheck tag at publication boundary
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.verify.outputs.tag }}
          RELEASE_REVISION: ${{ needs.verify.outputs.revision }}
        run: node scripts/release-identity.mjs
        if: steps.plan.outputs.is_latest == 'true'
      - name: Promote the verified immutable digest
        if: steps.plan.outputs.is_latest == 'true'
        env:
          RELEASE_IMAGE: ${{ needs.verify.outputs.image }}
          RELEASE_DIGEST: ${{ needs.publish.outputs.digest }}
        run: docker buildx imagetools create --tag "$RELEASE_IMAGE:latest" "$RELEASE_IMAGE@$RELEASE_DIGEST"
