name: Set up JavaScript workspace
description: Install the pinned Node.js, pnpm and locked workspace dependencies.
inputs:
  cache:
    description: Cache the pnpm store; release packaging uses an isolated install.
    default: 'true'
runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
      with:
        node-version-file: package.json
        cache: ${{ inputs.cache == 'true' && 'pnpm' || '' }}
        package-manager-cache: false
    - run: pnpm install --frozen-lockfile
      shell: bash
