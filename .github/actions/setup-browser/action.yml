name: Set up Chromium
description: Cache the browser matching the installed Playwright and verify it launches.
runs:
  using: composite
  steps:
    - id: playwright
      shell: bash
      run: echo "version=$(node -p 'require("playwright-core/package.json").version')" >> "$GITHUB_OUTPUT"
    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ steps.playwright.outputs.version }}
    - run: node scripts/install-chromium.mjs
      shell: bash
